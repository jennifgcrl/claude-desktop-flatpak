name: Update Claude version

# Once a day, check Anthropic's apt repo for a newer claude-desktop release and,
# if there is one, open a PR bumping the pinned version + sha256 sums (and the
# OVMF firmware). The PR auto-merges once the required Build check passes.
#
# The PR is opened with a GitHub App installation token (not the default
# GITHUB_TOKEN), so it is NOT subject to GitHub's anti-recursion rule and the
# Build workflow runs on it automatically. Requires two repo secrets:
#   APP_ID           - the GitHub App's id
#   APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on this repo with Contents: write and
# Pull requests: write permissions. See README for the one-time setup.
on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate a GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Rewrites version + per-arch sha256 in the manifest and the metainfo
      # <release>. A no-op if already on the latest version.
      - name: Bump to latest upstream release
        run: ./update-version.sh

      - name: Open PR if anything changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/claude-version
          delete-branch: true
          commit-message: Bump Claude Desktop to the latest upstream release
          title: Bump Claude Desktop to the latest upstream release
          body: |
            Automated daily bump by `update-version.sh`.

            Auto-merges once the **Build** check passes.

      - name: Auto-merge once Build passes
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"
