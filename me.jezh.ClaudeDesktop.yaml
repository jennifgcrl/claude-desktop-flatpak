# Flatpak manifest for Claude Desktop (Linux beta), repackaged from Anthropic's
# official .deb. This does NOT rebuild Claude from source — it extracts the
# prebuilt Electron app from the signed .deb and runs it under zypak inside the
# Flatpak sandbox.
#
# It additionally bundles QEMU + OVMF firmware so the "Cowork" feature (which
# boots a KVM microVM) works inside the sandbox. QEMU is bundled for x86_64
# only; on aarch64 you get Chat + Claude Code but not Cowork (see README).
#
# Upstream ships only a .deb (apt repo at downloads.claude.ai). To bump the
# Claude version, change the two per-arch sha256 sums + urls, or run
# ./update-version.sh.
app-id: me.jezh.ClaudeDesktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
# The Electron BaseApp provides zypak (zypak-wrapper) plus the shared libs a
# prebuilt Electron/Chromium binary expects. It is what lets us run Chromium's
# sandbox without the SUID chrome-sandbox helper (forbidden in Flatpak).
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: claude-desktop

finish-args:
  # Chromium/Electron IPC and network.
  - --share=ipc
  - --share=network
  # Display: prefer Wayland when present, fall back to X11 (XWayland).
  - --socket=wayland
  - --socket=fallback-x11
  # Audio (notification sounds, voice playback).
  - --socket=pulseaudio
  # Cowork boots a KVM microVM. It needs BOTH /dev/kvm and /dev/vhost-vsock,
  # and Flatpak has no granular option for the latter, so we expose all host
  # devices. This also covers --device=dri (GPU). If you don't use Cowork you
  # can replace this with `--device=dri --device=kvm` for a tighter sandbox.
  - --device=all
  # Claude Code / Cowork operate on the user's projects; the app also reads the
  # shared ~/.claude config used by the CLI. Narrow this to specific project
  # dirs if you prefer tighter isolation.
  - --filesystem=home
  # Desktop notifications (libnotify).
  - --talk-name=org.freedesktop.Notifications
  # Credential storage (libsecret -> gnome-keyring / kwallet via Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Tray icon (StatusNotifierItem / AppIndicator).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  # Let Electron pick the right Ozone backend automatically.
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  # --- Cowork VM stack (x86_64) --------------------------------------------
  # QEMU's user-mode networking (-netdev user) needs libslirp, which is the
  # one dependency the freedesktop runtime/SDK doesn't already provide.
  - name: libslirp
    only-arches: [x86_64]
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.3/libslirp-v4.9.3.tar.gz
        sha256: ee698ca4ce05217ca7d520c7f0b1b1228fd7d32922dd32d1051c347152588417

  # QEMU, built minimal: just the x86_64 system emulator with KVM, slirp, and
  # the virtio / vhost-user / vhost-vsock devices Cowork uses (q35 machine,
  # vhost-user-fs-pci for virtiofs, vhost-vsock-pci, virtio-blk/net/rng/serial).
  # GUI, audio, VNC, SPICE etc. are disabled — the VM is headless. Installs
  # qemu-system-x86_64 to /app/bin (the app finds it via PATH) and its firmware
  # blobs to /app/share/qemu.
  - name: qemu
    only-arches: [x86_64]
    buildsystem: simple
    # qemu's build ensures a set of Python packages in a build venv. Most are
    # vendored in the tarball (meson, pycotap, qemu.qmp); the "functests" group's
    # sole member, pygdbmi, is not — qemu would fetch it from PyPI. There's no
    # network in the build sandbox, so we ship that wheel (below) and point pip
    # at it offline. Without this the `functests.group` build target fails.
    build-options:
      env:
        PIP_NO_INDEX: '1'
        PIP_FIND_LINKS: /run/build/qemu
    build-commands:
      - |
        ./configure \
          --prefix=/app \
          --target-list=x86_64-softmmu \
          --enable-kvm \
          --enable-slirp \
          --disable-docs \
          --disable-gtk --disable-sdl --disable-vnc --disable-curses \
          --disable-spice --disable-opengl --disable-virglrenderer --disable-vte \
          --disable-brlapi --disable-werror \
          --disable-fdt --disable-rust \
          --audio-drv-list=
      - make -j${FLATPAK_BUILDER_N_JOBS:-4}
      - make install
    sources:
      - type: archive
        url: https://download.qemu.org/qemu-11.0.2.tar.xz
        sha256: 3745f6ea88e2e87fe0dc838b2b1d4e0a770bf48e01a1d5a186842a1fff76ccf5
      # Offline wheel for qemu's build venv (see build-options.env above).
      - type: file
        url: https://files.pythonhosted.org/packages/c8/4b/71df806f4d260ddf01f9e431f5a6538a4155db3ec84a131d7e087178c591/pygdbmi-0.11.0.0-py3-none-any.whl
        sha256: f7cac28e1d558927444c880ed1e65da1a5d8686121a3aac16f42fb84d3ceb60d

  # OVMF UEFI firmware, extracted from Debian's ovmf-generic .deb (arch-neutral
  # prebuilt firmware blobs — no libraries). The app looks for firmware at a
  # hardcoded /usr/share/OVMF/ path which we redirect to /app/share/OVMF via an
  # in-place asar patch below.
  - name: ovmf
    only-arches: [x86_64]
    buildsystem: simple
    build-commands:
      - ar x ovmf-generic.deb
      - mkdir -p data && tar -xf data.tar.xz -C data
      - install -Dm644 data/usr/share/OVMF/OVMF_CODE_4M.fd /app/share/OVMF/OVMF_CODE_4M.fd
      - install -Dm644 data/usr/share/OVMF/OVMF_VARS_4M.fd /app/share/OVMF/OVMF_VARS_4M.fd
    sources:
      - type: file
        url: http://ftp.debian.org/debian/pool/main/e/edk2/ovmf-generic_2025.11-5_all.deb
        sha256: f7eb07ca56df6b5fbae7b98a294515ddb37e15fae25b7ff91b9deb1681d91416
        dest-filename: ovmf-generic.deb

  # --- Claude Desktop itself -----------------------------------------------
  - name: claude-desktop
    buildsystem: simple
    build-commands:
      # A .deb is an `ar` archive; binutils (ar) and tar/xz ship in the SDK.
      - ar x claude-desktop.deb
      - mkdir -p data
      - tar -xf data.tar.xz -C data

      # The prebuilt Electron app tree.
      - cp -a data/usr/lib/claude-desktop /app/lib/claude-desktop
      # chrome-sandbox is useless (and blocked) inside Flatpak; zypak replaces it.
      - rm -f /app/lib/claude-desktop/chrome-sandbox

      # Cowork firmware redirect: the app hardcodes /usr/share/OVMF (read-only
      # runtime) as the firmware search path. Rewrite it to /app/share/OVMF in
      # place — "/usr/" and "/app/" are the same length, so the asar's byte
      # offsets stay valid and no repack is needed. (Same for arm's AAVMF.)
      - |
        python3 - <<'PY'
        from pathlib import Path
        p = Path("/app/lib/claude-desktop/resources/app.asar")
        d = p.read_bytes()
        before = len(d)
        d = d.replace(b"/usr/share/OVMF/",  b"/app/share/OVMF/")
        d = d.replace(b"/usr/share/AAVMF/", b"/app/share/AAVMF/")
        assert len(d) == before, "asar length changed — offsets would break"
        p.write_bytes(d)
        print("asar firmware paths redirected to /app")
        PY

      # Launcher: run the bundled Electron binary through zypak.
      - install -Dm755 claude-desktop.sh /app/bin/claude-desktop

      # Desktop entry: reuse upstream's (keeps the claude:// handler + actions),
      # renamed to the app-id and repointed at our exported icon name.
      - install -Dm644 data/usr/share/applications/claude-desktop.desktop
          /app/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/" /app/share/applications/${FLATPAK_ID}.desktop

      # Icons, renamed to the app-id so Flatpak exports them.
      - |
        for s in 16 32 48 128 256; do
          install -Dm644 "data/usr/share/icons/hicolor/${s}x${s}/apps/claude-desktop.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"
        done

      # AppStream metadata (software-center listing).
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml
          /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: file
        only-arches: [x86_64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.17377.1_amd64.deb
        sha256: f4bd78545200877b591179838de7ad7a577df6ed2e845969dd25690efc5c85c7
        dest-filename: claude-desktop.deb
      - type: file
        only-arches: [aarch64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.17377.1_arm64.deb
        sha256: 658acbff14bd9c35d795ede46f097fca79d433ac4af792cdd6486acd3adc6f2e
        dest-filename: claude-desktop.deb
      - type: file
        path: claude-desktop.sh
      - type: file
        path: me.jezh.ClaudeDesktop.metainfo.xml
